<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting | Qortal</title>
  </head>
  <body>
    <script>
      (function () {
        var storageKey = 'qortal-org.spa.redirect';
        var currentPath =
          window.location.pathname +
          window.location.search +
          window.location.hash;
        var routeRoots = [
          '/explore',
          '/technology',
          '/ecosystem',
          '/get-started',
          '/build',
          '/community',
          '/about',
        ];
        var basePath = '/';
        for (var i = 0; i < routeRoots.length; i += 1) {
          var index = window.location.pathname.indexOf(routeRoots[i]);
          if (index > -1) {
            basePath = window.location.pathname.slice(0, index) || '/';
            break;
          }
        }
        try {
          window.sessionStorage.setItem(storageKey, currentPath);
        } catch (_error) {
          /* storage unavailable */
        }
        window.location.replace(window.location.origin + basePath);
      })();
    </script>
  </body>
</html>
